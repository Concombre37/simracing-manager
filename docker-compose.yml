services:
  postgres:
    image: postgres:16-alpine
    container_name: simracing-postgres
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - superuser_reserved_connections=10
    privileged: true
    restart: unless-stopped
    environment:
      POSTGRES_USER: simracing
      POSTGRES_PASSWORD: simracing
      POSTGRES_DB: simracing
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:rw,nosuid,size=100m
      - /tmp:rw,nosuid,size=100m
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simracing -d simracing']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: simracing-backend
    privileged: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3002}:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      # Cap Prisma's pool: this host has many CPU cores, so its automatic pool can
      # otherwise consume all PostgreSQL connections under concurrent dashboard polling.
      DATABASE_URL: postgresql://simracing:simracing@postgres:5432/simracing?schema=public&connection_limit=20&pool_timeout=10
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-https://simracing.hytlabs.com}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
